[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hecavex-radar"
version = "0.1.0"
description = "Production collectors and publisher for the HECAVEX-operated radar.hecavex.com service."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "tldextract==5.3.2",
  "tzdata==2026.3",
  "websockets==17.0.1",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.4",
]

[project.scripts]
hecavex-sync = "hecavex_radar.sync:run"
hecavex-certstream = "hecavex_radar.collect_certstream:run"
hecavex-urlscan = "hecavex_radar.urlscan:run"
hecavex-review = "hecavex_radar.review:run"

[tool.setuptools.packages.find]
include = ["hecavex_radar*"]

[tool.pytest.ini_options]
testpaths = ["tests_python"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests_python/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true

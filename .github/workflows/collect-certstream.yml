name: Collect CertStream candidates

on:
  schedule:
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-certstream-writer
  cancel-in-progress: false
  queue: max

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CERTSTREAM_DURATION_SECONDS: "480"
      CERTSTREAM_EXPECTED_INTERVAL_SECONDS: "900"
      CERTSTREAM_STALE_AFTER_SECONDS: "2700"
      CERTSTREAM_DELAY_THRESHOLD_SECONDS: "300"
      CERTSTREAM_SCHEDULE_MINUTES: "8,23,38,53"
      CERTSTREAM_TRIGGER: ${{ github.event_name }}
      CERTSTREAM_HEALTH_PATH: public/data/collection-health.json
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/automation-runtime-py312.lock
      - name: Initialize public collection health
        run: python -m hecavex_radar.collection_health begin
      - name: Install Python dependencies
        id: dependencies
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/automation-runtime-py312.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
      - name: Prepare CertStream source
        id: source
        if: always() && steps.dependencies.outcome == 'success'
        continue-on-error: true
        env:
          CERTSTREAM_SOURCE_URL: ${{ secrets.CERTSTREAM_URL || vars.CERTSTREAM_URL }}
        shell: bash
        run: |
          if [[ -n "${CERTSTREAM_SOURCE_URL}" ]]; then
            echo "CERTSTREAM_URL=${CERTSTREAM_SOURCE_URL}" >> "${GITHUB_ENV}"
            echo "CERTSTREAM_ALLOW_INSECURE_WS=false" >> "${GITHUB_ENV}"
            exit 0
          fi
          docker run --detach --name certstream-source \
            --publish 127.0.0.1:8080:8080 \
            --env CERTSTREAM_STREAM_FULL_ENABLED=false \
            --env CERTSTREAM_STREAM_LITE_ENABLED=true \
            --env CERTSTREAM_STREAM_DOMAINS_ONLY_ENABLED=false \
            ghcr.io/reloading01/certstream-server-rust:1.5.3@sha256:e7422e0b41aa89358ed4f07a0c78a5e80208c3ae0bff1c367bd0929ba2fa0e0b
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then
              echo "CERTSTREAM_URL=ws://127.0.0.1:8080/" >> "${GITHUB_ENV}"
              echo "CERTSTREAM_ALLOW_INSECURE_WS=true" >> "${GITHUB_ENV}"
              exit 0
            fi
            sleep 2
          done
          echo "Local CertStream source did not become healthy." >&2
          exit 1
      - name: Collect a bounded CertStream window
        id: collector
        if: always() && steps.source.outcome == 'success'
        continue-on-error: true
        env:
          CERTSTREAM_FLUSH_SECONDS: "15"
          CERTSTREAM_IDLE_SECONDS: "90"
          CERTSTREAM_REQUIRE_MESSAGES: "true"
          CERTSTREAM_MIN_CONFIDENCE: ${{ vars.CERTSTREAM_MIN_CONFIDENCE }}
          CERTSTREAM_ARCHIVE_ROOT: data/certstream
        run: python -m hecavex_radar.collect_certstream
      - name: Stop local CertStream source
        if: always()
        shell: bash
        run: docker rm --force certstream-source 2> /dev/null || true
      - name: Finalize public collection health
        id: health
        if: always()
        env:
          CERTSTREAM_INSTALL_OUTCOME: ${{ steps.dependencies.outcome }}
          CERTSTREAM_PREPARE_OUTCOME: ${{ steps.source.outcome }}
          CERTSTREAM_COLLECTOR_OUTCOME: ${{ steps.collector.outcome }}
        run: python -m hecavex_radar.collection_health finalize
      - name: Commit the attempt atomically
        if: always() && steps.health.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git add -- data/certstream public/data/collection-health.json
          if git diff --cached --quiet; then
            echo "No collection changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: record CertStream collection attempt"
          gh auth setup-git
          base_sha="$(git rev-parse HEAD^)"
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin main
            upstream_sha="$(git rev-parse origin/main)"
            if [[ "${upstream_sha}" != "${base_sha}" ]]; then
              unexpected_paths="$(git diff --name-only "${base_sha}..${upstream_sha}" | grep -Ev \
                '^(data/(certstream|ct-search|enrichment|urlscan|history)/|public/data/)' || true)"
              if [[ -n "${unexpected_paths}" ]]; then
                echo "Code or configuration changed after checkout; refusing older-revision output:" >&2
                echo "${unexpected_paths}" >&2
                exit 1
              fi
              git rebase origin/main
              base_sha="${upstream_sha}"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [[ "${attempt}" -eq 4 ]]; then
              echo "CertStream publication lost four push races." >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
      - name: Fail an unsuccessful collection attempt
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.dependencies.outcome }}
          PREPARE_OUTCOME: ${{ steps.source.outcome }}
          COLLECTOR_OUTCOME: ${{ steps.collector.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
        shell: bash
        run: |
          if [[ "${INSTALL_OUTCOME}" != "success" || \
            "${PREPARE_OUTCOME}" != "success" || \
            "${COLLECTOR_OUTCOME}" != "success" || \
            "${HEALTH_OUTCOME}" != "success" ]]; then
            echo "The attempt was recorded, but collection did not complete successfully." >&2
            exit 1
          fi

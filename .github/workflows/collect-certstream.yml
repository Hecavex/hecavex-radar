name: Collect CertStream candidates

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: certstream-archive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CERTSTREAM_SOURCE_URL: ${{ secrets.CERTSTREAM_URL || vars.CERTSTREAM_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check .
      - name: Prepare CertStream source
        shell: bash
        run: |
          if [[ -n "${CERTSTREAM_SOURCE_URL}" ]]; then
            echo "CERTSTREAM_URL=${CERTSTREAM_SOURCE_URL}" >> "${GITHUB_ENV}"
            echo "CERTSTREAM_ALLOW_INSECURE_WS=false" >> "${GITHUB_ENV}"
            exit 0
          fi
          docker run --detach --name certstream-source \
            --publish 127.0.0.1:8080:8080 \
            --env CERTSTREAM_STREAM_FULL_ENABLED=false \
            ghcr.io/reloading01/certstream-server-rust:1.5.3@sha256:e7422e0b41aa89358ed4f07a0c78a5e80208c3ae0bff1c367bd0929ba2fa0e0b
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then
              echo "CERTSTREAM_URL=ws://127.0.0.1:8080/domains-only" >> "${GITHUB_ENV}"
              echo "CERTSTREAM_ALLOW_INSECURE_WS=true" >> "${GITHUB_ENV}"
              exit 0
            fi
            sleep 2
          done
          echo "Local CertStream source did not become healthy." >&2
          exit 1
      - name: Collect a bounded CertStream window
        env:
          CERTSTREAM_DURATION_SECONDS: "240"
          CERTSTREAM_FLUSH_SECONDS: "15"
          CERTSTREAM_IDLE_SECONDS: "90"
          CERTSTREAM_REQUIRE_MESSAGES: "true"
          CERTSTREAM_MIN_CONFIDENCE: ${{ vars.CERTSTREAM_MIN_CONFIDENCE }}
          CERTSTREAM_ARCHIVE_ROOT: data/candidates
        run: python -m hecavex_radar.collect_certstream
      - name: Stop local CertStream source
        if: always()
        shell: bash
        run: docker rm --force certstream-source 2> /dev/null || true
      - name: Commit new daily candidates
        shell: bash
        run: |
          git add data/candidates
          if git diff --cached --quiet; then
            echo "No new candidates to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update CertStream candidate archive"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

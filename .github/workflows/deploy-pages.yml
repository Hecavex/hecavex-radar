name: Sync and deploy radar

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/candidates/**"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check .
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Sync approved feeds
        if: vars.RADAR_SYNC_ENABLED == 'true'
        env:
          PHISHTANK_APP_KEY: ${{ secrets.PHISHTANK_APP_KEY }}
          PHISHTANK_ENABLED: ${{ vars.PHISHTANK_ENABLED || 'true' }}
          PHISHTANK_REQUIRE_APP_KEY: "true"
          PHISHTANK_USER_AGENT: ${{ vars.PHISHTANK_USER_AGENT }}
          OPENPHISH_ENABLED: ${{ vars.OPENPHISH_ENABLED }}
          OPENPHISH_ACCEPT_TERMS: ${{ vars.OPENPHISH_ACCEPT_TERMS }}
          CERTSTREAM_ARCHIVE_ENABLED: "true"
          CERTSTREAM_ARCHIVE_ROOT: data/candidates
          RADAR_CT_LOOKBACK_DAYS: ${{ vars.RADAR_CT_LOOKBACK_DAYS }}
          VMRAY_ENABLED: ${{ vars.VMRAY_ENABLED }}
          VMRAY_ACCEPT_TERMS: ${{ vars.VMRAY_ACCEPT_TERMS }}
          VMRAY_PAGES: ${{ vars.VMRAY_PAGES }}
          HECAVEX_FEED_URL: ${{ secrets.HECAVEX_FEED_URL }}
          HECAVEX_FEED_TOKEN: ${{ secrets.HECAVEX_FEED_TOKEN }}
          RADAR_MAX_SIGNALS: ${{ vars.RADAR_MAX_SIGNALS }}
          RADAR_MIN_SIGNALS: ${{ vars.RADAR_MIN_SIGNALS || '100' }}
          RADAR_MIN_RETAINED_PERCENT: ${{ vars.RADAR_MIN_RETAINED_PERCENT || '25' }}
          RADAR_SCREENSHOT_HOSTS: ${{ vars.RADAR_SCREENSHOT_HOSTS }}
        run: python -m hecavex_radar.sync
      - name: Build static site
        run: pnpm build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

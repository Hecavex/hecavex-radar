name: Deploy radar

on:
  workflow_run:
    workflows: ["CI", "Sync radar snapshot"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      ((github.event.workflow_run.name == 'CI' && github.event.workflow_run.event == 'push') ||
      (github.event.workflow_run.name == 'Sync radar snapshot' &&
      (github.event.workflow_run.event == 'schedule' ||
      github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      should_deploy: ${{ steps.freshness.outputs.should_deploy }}
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Ignore stale or unchanged completions
        id: freshness
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
        shell: bash
        run: |
          should_deploy=true
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${TRIGGER_WORKFLOW}" == "CI" && "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "A newer main commit superseded this CI run; its own successful run will deploy."
            should_deploy=false
          elif [[ "${TRIGGER_WORKFLOW}" == "Sync radar snapshot" ]]; then
            if [[ "${actual_sha}" == "${EXPECTED_SHA}" ]] ||
              git diff --quiet "${EXPECTED_SHA}..${actual_sha}" -- public/data/radar.json; then
              echo "The sync completed without changing the public snapshot; deployment is unnecessary."
              should_deploy=false
            fi
          fi
          echo "should_deploy=${should_deploy}" >> "${GITHUB_OUTPUT}"
      - name: Set up Node.js
        if: steps.freshness.outputs.should_deploy == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Enable pnpm
        if: steps.freshness.outputs.should_deploy == 'true'
        run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - name: Install dependencies
        if: steps.freshness.outputs.should_deploy == 'true'
        run: pnpm install --frozen-lockfile
      - name: Verify and build static site
        if: steps.freshness.outputs.should_deploy == 'true'
        run: pnpm check:frontend
      - name: Verify public deployment metadata
        if: steps.freshness.outputs.should_deploy == 'true'
        shell: bash
        run: |
          test -f dist/security.txt
          test -f dist/.well-known/security.txt
          cmp --silent dist/security.txt dist/.well-known/security.txt
          grep -Fqx "Canonical: https://radar.hecavex.com/.well-known/security.txt" dist/.well-known/security.txt
          grep -Fq '<link rel="canonical" href="https://radar.hecavex.com/"' dist/index.html
          grep -Fq 'Sampled discovery, not continuous monitoring' dist/index.html
          grep -Fq '"@type":"Dataset"' dist/index.html
          test -f dist/history/index.html
          grep -Fq '<link rel="canonical" href="https://radar.hecavex.com/history/"' dist/history/index.html
          grep -Fq 'Candidate history' dist/history/index.html
          test -f dist/methodology/index.html
          grep -Fq '<link rel="canonical" href="https://radar.hecavex.com/methodology/"' dist/methodology/index.html
          grep -Fq 'How a signal reaches Radar' dist/methodology/index.html
          test -f dist/docs/index.html
          grep -Fq '<link rel="canonical" href="https://radar.hecavex.com/docs/"' dist/docs/index.html
          grep -Fq 'HECAVEX Radar technical reference' dist/docs/index.html
          grep -Fq 'Allow: /data/radar.json' dist/robots.txt
          grep -Fq 'Allow: /data/history.json' dist/robots.txt
          grep -Fq 'https://radar.hecavex.com/history/' dist/sitemap.xml
          grep -Fq 'https://radar.hecavex.com/methodology/' dist/sitemap.xml
          grep -Fq 'https://radar.hecavex.com/docs/' dist/sitemap.xml
      - name: Configure GitHub Pages
        if: steps.freshness.outputs.should_deploy == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload site artifact
        if: steps.freshness.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    if: needs.build.outputs.should_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

name: Poll checkpointed CT search

on:
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-certstream-writer
  cancel-in-progress: false
  queue: max

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/automation-runtime-py312.lock
      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/automation-runtime-py312.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
      - name: Poll replayable CT keyword searches
        id: poll
        continue-on-error: true
        env:
          CT_SEARCH_STATE_PATH: data/ct-search/state.json
          CT_SEARCH_QUERIES_PER_RUN: ${{ vars.CT_SEARCH_QUERIES_PER_RUN || '6' }}
          CT_SEARCH_ROWS_PER_QUERY: ${{ vars.CT_SEARCH_ROWS_PER_QUERY || '500' }}
          CT_SEARCH_BOOTSTRAP_DAYS: ${{ vars.CT_SEARCH_BOOTSTRAP_DAYS || '7' }}
          CT_SEARCH_REPLAY_IDS: ${{ vars.CT_SEARCH_REPLAY_IDS || '1000' }}
          CT_SEARCH_REPLAY_ROWS: ${{ vars.CT_SEARCH_REPLAY_ROWS || '50' }}
          CERTSTREAM_ARCHIVE_ROOT: data/certstream
        run: python -m hecavex_radar.ct_search
      - name: Commit checkpoint and candidates atomically
        id: commit
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git add -- data/ct-search data/certstream
          if git diff --cached --quiet; then
            echo "No CT checkpoint or candidate changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: checkpoint CT search"
          gh auth setup-git
          base_sha="$(git rev-parse HEAD^)"
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin main
            upstream_sha="$(git rev-parse origin/main)"
            if [[ "${upstream_sha}" != "${base_sha}" ]]; then
              unexpected_paths="$(git diff --name-only "${base_sha}..${upstream_sha}" | grep -Ev \
                '^(data/(certstream|ct-search|enrichment|urlscan|history)/|public/data/)' || true)"
              if [[ -n "${unexpected_paths}" ]]; then
                echo "Code or configuration changed after checkout; refusing older-revision output:" >&2
                echo "${unexpected_paths}" >&2
                exit 1
              fi
              git rebase origin/main
              base_sha="${upstream_sha}"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [[ "${attempt}" -eq 4 ]]; then
              echo "CT checkpoint publication lost four push races." >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
      - name: Propagate polling or publication failure
        if: always() && (steps.poll.outcome != 'success' || steps.commit.outcome != 'success')
        shell: bash
        run: |
          echo "CT polling or checkpoint publication failed."
          exit 1

name: Refresh temporal passive context

on:
  schedule:
    - cron: "31 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-archive-writer
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/automation-runtime-py312.lock

      - name: Install validated runtime
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/automation-runtime-py312.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .

      - name: Refresh bounded context and change journal
        id: refresh
        continue-on-error: true
        env:
          PASSIVE_CONTEXT_STATE: data/enrichment/passive-context.json
          PASSIVE_CONTEXT_JOURNAL: data/history/context
          PASSIVE_CONTEXT_PER_RUN: ${{ vars.PASSIVE_CONTEXT_PER_RUN || '20' }}
          PASSIVE_CONTEXT_CACHE_HOURS: ${{ vars.PASSIVE_CONTEXT_CACHE_HOURS || '24' }}
          PASSIVE_CONTEXT_URLSCAN_DAYS: ${{ vars.PASSIVE_CONTEXT_URLSCAN_DAYS || '14' }}
          PASSIVE_CONTEXT_JOURNAL_DAYS: ${{ vars.PASSIVE_CONTEXT_JOURNAL_DAYS || '60' }}
          PASSIVE_CONTEXT_RPKI_ENABLED: ${{ vars.PASSIVE_CONTEXT_RPKI_ENABLED || 'false' }}
          URLSCAN_DERIVED_REDISTRIBUTION_CONFIRMED: ${{ vars.URLSCAN_DERIVED_REDISTRIBUTION_CONFIRMED || 'false' }}
          PASSIVE_CONTEXT_RUN_BUDGET_SECONDS: ${{ vars.PASSIVE_CONTEXT_RUN_BUDGET_SECONDS || '480' }}
        run: python -m hecavex_radar.passive_context

      - name: Commit bounded state and journal
        id: commit
        if: steps.refresh.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git add -- data/enrichment/passive-context.json
          if [[ -d data/history/context ]]; then
            git add -- data/history/context
          fi
          if git diff --cached --quiet; then
            echo "Passive context is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh temporal passive context"
          gh auth setup-git
          base_sha="$(git rev-parse HEAD^)"
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin main
            upstream_sha="$(git rev-parse origin/main)"
            if [[ "${upstream_sha}" != "${base_sha}" ]]; then
              unexpected_paths="$(git diff --name-only "${base_sha}..${upstream_sha}" | grep -Ev \
                '^(data/(certstream|ct-search|enrichment|urlscan|history)/|public/data/)' || true)"
              if [[ -n "${unexpected_paths}" ]]; then
                echo "Code or configuration changed after checkout; refusing older-revision output:" >&2
                echo "${unexpected_paths}" >&2
                exit 1
              fi
              git rebase origin/main
              base_sha="${upstream_sha}"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [[ "${attempt}" -eq 4 ]]; then
              echo "Passive-context publication lost four push races." >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Propagate collection or publication failure
        if: always() && (steps.refresh.outcome != 'success' || steps.commit.outcome != 'success')
        run: |
          echo "Passive-context refresh or state publication failed."
          exit 1

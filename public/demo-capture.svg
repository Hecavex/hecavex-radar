<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Safe demonstration capture</title>
  <desc id="description">A synthetic sign-in page used only to demonstrate the screenshot viewer.</desc>
  <rect width="1280" height="720" fill="#e9edf2"/>
  <rect width="1280" height="66" fill="#151c25"/>
  <circle cx="31" cy="33" r="8" fill="#e15a4f"/><circle cx="57" cy="33" r="8" fill="#dda94f"/><circle cx="83" cy="33" r="8" fill="#6db18a"/>
  <rect x="145" y="19" width="990" height="28" rx="4" fill="#273342"/>
  <text x="166" y="38" fill="#8693a2" font-family="monospace" font-size="13">hxxps://secure-login[.]example[.]test/session</text>
  <rect x="430" y="130" width="420" height="475" rx="8" fill="#fff" stroke="#cbd3dc"/>
  <rect x="582" y="176" width="116" height="48" rx="4" fill="#293e65"/>
  <text x="640" y="207" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-weight="700" font-size="18">EXAMPLE</text>
  <text x="640" y="274" text-anchor="middle" fill="#263241" font-family="Arial, sans-serif" font-weight="700" font-size="27">Sign in to continue</text>
  <text x="500" y="332" fill="#647284" font-family="Arial, sans-serif" font-size="14">Email address</text>
  <rect x="500" y="347" width="280" height="48" rx="3" fill="#f8fafc" stroke="#aeb9c7"/>
  <text x="500" y="433" fill="#647284" font-family="Arial, sans-serif" font-size="14">Password</text>
  <rect x="500" y="448" width="280" height="48" rx="3" fill="#f8fafc" stroke="#aeb9c7"/>
  <rect x="500" y="526" width="280" height="48" rx="3" fill="#3568ad"/>
  <text x="640" y="557" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-weight="700" font-size="15">Continue</text>
  <rect x="0" y="675" width="1280" height="45" fill="#e15a4f"/>
  <text x="640" y="704" text-anchor="middle" fill="#fff" font-family="monospace" font-weight="700" font-size="14">SYNTHETIC DEMO — NOT A LIVE PHISHING PAGE</text>
</svg>
